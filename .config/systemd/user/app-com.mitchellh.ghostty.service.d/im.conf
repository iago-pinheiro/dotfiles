# Acentos/teclas mortas no Ghostty (GTK 4.20+)
#
# O GTK passou a delegar a composição de teclas mortas ao IME do compositor e,
# sem um IME (ibus/fcitx) rodando, "´ + a" não vira "á". Forçar o contexto
# simples do GTK devolve a composição nativa (mesma solução indicada no
# upstream: ghostty-org/ghostty discussion #8899).
#
# Aplicar: systemctl --user daemon-reload && systemctl --user restart app-com.mitchellh.ghostty.service
[Service]
Environment=GTK_IM_MODULE=simple
